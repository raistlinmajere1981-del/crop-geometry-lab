[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-geometry-lab"
version = "0.6.0"
description = "Human-in-the-loop geometric analysis of crop-circle aerial images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.1,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
crop-geometry-lab = "src.webapp:main"
crop-geometry-synthetic = "src.synthetic:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
